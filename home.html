    <link rel="stylesheet" href="style.css"> <!-- You can reuse your stylesheet -->

<body>
    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3 class="cart-title">Your Cart</h3>
            <button class="close-cart-btn" onclick="toggleCart()">×</button>
        </div>
        <div id="cart-items-container" class="cart-items">
            <!-- Items loaded here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">

    </div>

        <!-- Profile Picture -->
        <div style="position: relative;">

            <input type="file" id="profile-pic-input" accept="image/*" style="display: none;">
        </div>

        <div class="profile-info">
            <h2 id="show-name">Name</h2>
            <p class="profile-username">@<span id="show-username">username</span></p>
        </div>

        <!-- Stats row underneath name -->
        <div class="sidebar-stats">
            <div class="stat-col">
                <div class="stat-num">18</div>
                <div class="stat-label">Reviews</div>
            </div>
            <div class="stat-col">
                <div id="user-recipe-count" class="stat-num">0</div>
                <div class="stat-label">Recipes</div>

            <div class="stat-col">
                <div class="stat-num">7</div>
                <div class="stat-label">Lists</div>
            </div>
        </div>

        
        <div class="sidebar-nav">
            <a href="home.html" class="sidebar-nav-link active">Home</a>
            <a href="#" class="sidebar-nav-link">Explore</a>
            <button id="sidebar-add-recipe-btn" class="sidebar-nav-link" style="background: none; border: 3px solid #fdfcd7; text-align: left; cursor: pointer; color: #fdfcd7; font-family: inherit; font-size: 18px; padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; transition: background-color 0.2s;">Add Recipe</button>
            <a href="#" class="sidebar-nav-link">Lists</a>
            <a href="home.html?filter=liked" class="sidebar-nav-link">Liked Recipes</a>
            <a href="#" class="sidebar-nav-link">My Reviews</a>
            <a href="#" class="sidebar-nav-link">Settings</a>
        </div>

        <!-- My Lists widget -->

            <h4>My Lists</h4>

                <span>Want to Try</span>
                <span class="sidebar-lists-badge">8</span>
            </div>
            <div class="sidebar-lists-item">
                <span>Made It</span>
                <span class="sidebar-lists-badge">12</span>
            </div>
            <div class="sidebar-lists-item">
                <span>Favorites</span>
                <span class="sidebar-lists-badge">6</span>
            </div>
            <div class="sidebar-lists-item">
                <span>Quick & Easy</span>
                <span class="sidebar-lists-badge">5</span>
            </div>
        </div>

        <!-- Collapsible Add Recipe Section -->
        <div class="add-recipe-section">
            <button id="toggle-add-form-btn" class="small-add-btn">+ Add Recipe</button>
            <form id="recipe-form" class="hidden-form">
                <input type="text" id="recipe-title" class="recipe-input" placeholder="Recipe Name" required>
                <input type="url" id="recipe-img-url" class="recipe-input" placeholder="Image URL (optional)">
                <textarea id="recipe-ingredients" class="recipe-textarea" placeholder="Ingredients (e.g. 1 lb Beef - $5.99, ...)"
                    rows="3" required></textarea>
                <textarea id="recipe-instructions" class="recipe-textarea" placeholder="Instructions & directions"
                    rows="3" required></textarea>
                <button type="submit" class="add-recipe-btn">Share Recipe</button>
            </form>
        </div>

        <div class="profile-details">
            <p style="margin-bottom: 8px;"><strong>Status:</strong> Online</p>

                <button id="toggle-password" style="background: none; border: none; cursor: pointer; color: #fdfcd7; font-size: 14px; text-decoration: underline; padding: 0; display: inline-flex; align-items: center;">Show</button>

            document.getElementById('show-name').textContent = savedName || "Guest";
            document.getElementById('show-username').textContent = savedUser;

            const passwordSpan = document.getElementById('show-password');
            const toggleButton = document.getElementById('toggle-password');

            
            passwordSpan.textContent = '•'.repeat(savedPass ? savedPass.length : 8);

            toggleButton.addEventListener('click', () => {
                isPasswordVisible = !isPasswordVisible;
                if (isPasswordVisible) {
                    passwordSpan.textContent = savedPass;
                    toggleButton.textContent = 'Hide';
                } else {
                    passwordSpan.textContent = '•'.repeat(savedPass ? savedPass.length : 8);
                    toggleButton.textContent = 'Show';
                }
            });
        } else {
            window.location.href = 'sign.html';
        }

       
        const profileAvatar = document.getElementById('profile-avatar');
        const profilePicInput = document.getElementById('profile-pic-input');
        
        const savedPic = localStorage.getItem('userProfilePic');
        if (savedPic && profileAvatar) {
            profileAvatar.src = savedPic;
        }

        if (profilePicInput && profileAvatar) {
            profilePicInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const base64Str = event.target.result;
                        profileAvatar.src = base64Str;
                        localStorage.setItem('userProfilePic', base64Str);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

            sessionStorage.clear();

        const recipesGrid = document.getElementById('recipes-grid');

        function renderRecipes() {
            recipesGrid.innerHTML = '';

            const urlParams = new URLSearchParams(window.location.search);
            const isLikedFilter = urlParams.get('filter') === 'liked';
            
            let displayRecipes = recipes;

            if (isLikedFilter) {
                const likedIds = JSON.parse(localStorage.getItem('likedRecipes')) || [];
                displayRecipes = recipes.filter(r => likedIds.includes(r.id));
                
                const featured = JSON.parse(localStorage.getItem('featuredRecipes')) || [];
                const likedFeatured = featured.filter(r => likedIds.includes(r.id));
                
                displayRecipes = displayRecipes.concat(likedFeatured);
                
                document.querySelector('.section-title').textContent = 'Liked Recipes';
                document.getElementById('featured-grid').parentElement.style.display = 'none';
                
                if (displayRecipes.length === 0) {
                    recipesGrid.innerHTML = '<p style="color: #666; font-size: 18px;">You haven\'t liked any recipes yet.</p>';
                }
            }

            displayRecipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';

                
                card.innerHTML = `
                    <button class="recipe-delete-btn" data-id="${recipe.id}">Delete</button>
                    <img src="${recipe.imgUrl || defaultFoodImg}" class="recipe-card-img" alt="${recipe.title}">
                    <div class="recipe-card-overlay">
                        <h3 class="recipe-card-title">${recipe.title}</h3>
                    </div>
                `;

                
                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('recipe-delete-btn')) {
                        return;
                    }
                    sessionStorage.setItem('activeRecipeId', recipe.id);
                    window.location.href = 'recipe.html';
                });

                recipesGrid.appendChild(card);
            });

            
            document.querySelectorAll('.recipe-delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    deleteRecipe(id);
                });
            });
        }

        if (recipeForm) {
            recipeForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const title = document.getElementById('recipe-title').value;
                const imgUrl = document.getElementById('recipe-img-url').value;
                const ingredients = document.getElementById('recipe-ingredients').value;
                const instructions = document.getElementById('recipe-instructions').value;

                const newRecipe = {
                    id: Date.now(),
                    title: title,
                    imgUrl: imgUrl,
                    ingredients: ingredients,
                    instructions: instructions,
                    creator: savedName || savedUser || "Guest",
                    prepTime: "10 mins",
                    cookTime: "15 mins",
                    servings: "4 servings",
                    difficulty: "Easy",
                    tags: "Home Cooked, Easy",
                    description: "A delicious, freshly shared home-cooked recipe.",
                    category: "Main Dish"
                };

                recipes.push(newRecipe);
                localStorage.setItem('dishedRecipes', JSON.stringify(recipes));

                renderRecipes();
                updateUserStats();
                recipeForm.reset();
                recipeForm.classList.remove('show');
                toggleFormBtn.textContent = '+ Add Recipe';
            });
        }

        
        function deleteRecipe(id) {
            recipes = recipes.filter(r => r.id !== id);
            localStorage.setItem('dishedRecipes', JSON.stringify(recipes));
            renderRecipes();
            updateUserStats();
        }


        const sidebarAddBtn = document.getElementById('sidebar-add-recipe-btn');
        if (sidebarAddBtn) {
            sidebarAddBtn.addEventListener('click', () => {
                recipeForm.classList.add('show');
                toggleFormBtn.textContent = 'Hide Add Form';
                recipeForm.scrollIntoView({ behavior: 'smooth' });
            });
        }

        function renderFeaturedRecipes() {
            featuredGrid.innerHTML = '';

            featuredRecipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';

                
                card.innerHTML = `
                    <img src="${recipe.imgUrl || defaultFoodImg}" class="recipe-card-img" alt="${recipe.title}">

            const badge = document.getElementById('cart-count-badge');
            
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center; margin-top: 20px;">Your cart is empty.</p>';
                badge.style.display = 'none';
            } else {
                badge.style.display = 'block';
                badge.textContent = cart.length;
                cart.forEach((item, index) => {
                    total += item.price;
                    const el = document.createElement('div');
                    el.className = 'cart-item';
                    el.innerHTML = `
                        <div class="cart-item-details">
                            <span class="cart-item-name">${item.name}</span>
                            <span class="cart-item-price">$${item.price.toFixed(2)}</span>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart(${index})">Remove</button>
                    `;
                    container.appendChild(el);
                });
            }
            totalEl.textContent = '$' + total.toFixed(2);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('dishedCart', JSON.stringify(cart));
            updateCartUI();
        }

        updateCartUI();
    </script>
</body>

</html>
