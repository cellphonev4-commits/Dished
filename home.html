<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dished | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-cream-100">
    <!-- The sidebar, basket drawer, recipe composer and toasts are injected by app.js -->

    <div class="lg:pl-[300px]">
        <div class="max-w-6xl mx-auto px-5 md:px-8 pb-24">

            <header id="topbar"></header>

            <!-- Greeting -->
            <section class="mb-8 animate-fade-up">
                <p class="text-sm text-muted mb-1" id="greeting-line">Welcome back</p>
                <h1 class="font-display text-4xl sm:text-5xl text-ink mb-3" id="greeting-name">Let's cook something</h1>
                <p class="font-display italic text-xl text-sage-600 border-l-4 border-sage-300 pl-4">
                    “Savor Every Bite, Tailored for Every Table.”
                </p>
            </section>

            <!-- Filters -->
            <section class="mb-8">
                <div class="flex items-center gap-2 mb-3 text-sm text-muted">
                    <i class="ph ph-funnel"></i> Filter by allergy or diet
                </div>
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="filter-bar"></div>
            </section>

            <!-- Feed -->
            <section id="feed" class="mb-14">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                    <h2 class="section-title" id="feed-title">
                        <i class="ph-duotone ph-bowl-food"></i> Shared recipes
                    </h2>
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-muted hidden sm:inline" id="feed-count"></span>
                        <select id="sort-select" class="select !py-2 !text-sm !w-auto" aria-label="Sort recipes">
                            <option value="newest">Newest first</option>
                            <option value="rating">Top rated</option>
                            <option value="quickest">Quickest</option>
                            <option value="alpha">A → Z</option>
                        </select>
                        <button class="btn btn-primary btn-sm" id="add-recipe-btn">
                            <i class="ph ph-plus"></i> <span class="hidden sm:inline">Add recipe</span>
                        </button>
                    </div>
                </div>
                <div id="recipes-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5"></div>
            </section>

            <!-- Featured -->
            <section id="featured-section">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                    <h2 class="section-title"><i class="ph-duotone ph-sparkle"></i> Featured by dished</h2>
                    <span class="chip"><i class="ph-fill ph-seal-check"></i> Editors' picks</span>
                </div>
                <div id="featured-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5"></div>
            </section>

        </div>
    </div>

    <script src="app.js"></script>
    <script>
        (function () {
            var qs = Dished.qs;

            Dished.mountShell({ active: new URLSearchParams(location.search).get('filter') === 'liked' ? 'liked' : 'home' });

            /* ---------------- Greeting ---------------- */
            var me = Dished.auth.current();
            var hour = new Date().getHours();
            qs('#greeting-line').textContent = hour < 12 ? 'Good morning' : (hour < 18 ? 'Good afternoon' : 'Good evening');
            qs('#greeting-name').textContent = me.isGuest
                ? "Let's find you something to cook"
                : 'What are you cooking, ' + me.name.split(' ')[0] + '?';

            /* ---------------- State ---------------- */
            var prefs = Dished.settings.get();
            var state = {
                tag: prefs.defaultFilter || 'all',
                query: new URLSearchParams(location.search).get('q') || '',
                sort: 'newest',
                likedOnly: new URLSearchParams(location.search).get('filter') === 'liked'
            };

            Dished.mountTopbar('#topbar', {
                placeholder: 'Search recipes, ingredients, tags, cooks…',
                onSearch: function (value) { state.query = value; render(); }
            });

            /* ---------------- Filter pills ---------------- */
            var FILTERS = [
                { label: 'All recipes', tag: 'all', glyph: 'squares-four' },
                { label: 'Gluten-free', tag: 'Gluten-Free', glyph: 'grains-slash' },
                { label: 'Dairy-free', tag: 'Dairy-Free', glyph: 'cow' },
                { label: 'Nut-free', tag: 'Nut-Free', glyph: 'acorn' },
                { label: 'Vegan', tag: 'Vegan', glyph: 'leaf' },
                { label: 'Vegetarian', tag: 'Vegetarian', glyph: 'carrot' },
                { label: 'Quick & easy', tag: 'Quick', glyph: 'lightning' }
            ];

            var filterBar = qs('#filter-bar');
            filterBar.innerHTML = FILTERS.map(function (f) {
                return '<button class="pill shrink-0' + (f.tag === state.tag ? ' is-active' : '') + '" data-tag="' + f.tag + '">' +
                    '<i class="ph ph-' + f.glyph + '"></i>' + f.label + '</button>';
            }).join('');

            filterBar.addEventListener('click', function (e) {
                var pill = e.target.closest('[data-tag]');
                if (!pill) return;
                state.tag = pill.dataset.tag;
                Dished.qsa('.pill', filterBar).forEach(function (p) { p.classList.remove('is-active'); });
                pill.classList.add('is-active');
                render();
            });

            qs('#sort-select').addEventListener('change', function (e) { state.sort = e.target.value; render(); });
            qs('#add-recipe-btn').addEventListener('click', function () { Dished.composer.open(); });

            /* ---------------- Filtering + sorting ---------------- */
            function matches(recipe) {
                if (state.tag !== 'all') {
                    var needle = state.tag.toLowerCase();
                    var haystack = [recipe.tags, recipe.title, recipe.category, recipe.ingredients].join(' ').toLowerCase();
                    if (haystack.indexOf(needle) === -1) return false;
                }
                if (state.query) {
                    var q = state.query.toLowerCase();
                    var fields = [recipe.title, recipe.category, recipe.tags, recipe.ingredients, recipe.creator];
                    if (!fields.some(function (f) { return String(f || '').toLowerCase().indexOf(q) > -1; })) return false;
                }
                return true;
            }

            function minutesOf(recipe) {
                var text = String(recipe.prepTime || '') + ' ' + String(recipe.cookTime || '');
                var total = 0;
                text.replace(/(\d+(?:\.\d+)?)\s*(hour|hr|min)/gi, function (_, n, unit) {
                    total += parseFloat(n) * (/hour|hr/i.test(unit) ? 60 : 1);
                    return '';
                });
                return total || 999;
            }

            function sorted(list) {
                var copy = list.slice();
                if (state.sort === 'rating') copy.sort(function (a, b) { return Dished.ratings.summary(b).rating - Dished.ratings.summary(a).rating; });
                if (state.sort === 'quickest') copy.sort(function (a, b) { return minutesOf(a) - minutesOf(b); });
                if (state.sort === 'alpha') copy.sort(function (a, b) { return a.title.localeCompare(b.title); });
                return copy;
            }

            /* ---------------- Rendering ---------------- */
            function paint(container, list, opts) {
                container.innerHTML = '';
                list.forEach(function (recipe, i) {
                    var card = Dished.recipeCard(recipe, opts);
                    card.style.animationDelay = Math.min(i * 40, 320) + 'ms';
                    card.classList.add('animate-fade-up');
                    container.appendChild(card);
                });
            }

            function askDelete(recipe) {
                var snapshot = Dished.data.remove(recipe.id);
                render();
                Dished.toast('“' + recipe.title + '” deleted', {
                    action: { label: 'Undo', fn: function () { Dished.data.restore(snapshot); render(); } }
                });
            }

            function render() {
                var grid = qs('#recipes-grid');
                var featuredGrid = qs('#featured-grid');
                var featuredSection = qs('#featured-section');

                var community = Dished.data.community();
                var featured = Dished.data.featured();

                if (state.likedOnly) {
                    var liked = Dished.likes.list();
                    community = community.concat(featured).filter(function (r) { return liked.indexOf(Number(r.id)) > -1; });
                    featured = [];
                    featuredSection.style.display = 'none';
                    qs('#feed-title').innerHTML = '<i class="ph-fill ph-heart"></i> Liked recipes';
                }

                var feed = sorted(community.filter(matches));
                var picks = sorted(featured.filter(matches));

                qs('#feed-count').textContent = feed.length + (feed.length === 1 ? ' recipe' : ' recipes');

                if (feed.length) {
                    /* Only recipes this browser created get a delete button;
                       everything else keeps the heart. */
                    paint(grid, feed, {
                        deletable: Dished.data.isCustom,
                        onDelete: askDelete
                    });
                } else if (state.likedOnly) {
                    Dished.emptyState(grid, 'heart', 'No liked recipes yet',
                        'Tap the heart on any recipe card and it will show up here.');
                } else {
                    Dished.emptyState(grid, 'magnifying-glass', 'Nothing matches that',
                        'Try a different filter, or clear the search box to see everything.');
                }

                if (!state.likedOnly) {
                    if (picks.length) paint(featuredGrid, picks, {});
                    else Dished.emptyState(featuredGrid, 'sparkle', 'No featured picks here',
                        'Change the filter to see the editors’ selection.');
                }
            }

            Dished.on('recipes:change', render);
            render();
        })();
    </script>
</body>

</html>
