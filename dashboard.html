<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Dashboard & AI Assistant</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <aside class="sidebar">
    <div class="profile-card">
      <div class="avatar" id="userInitials">U</div>
      <h3 id="profileName">User Name</h3>
      <p id="profileEmail">user@example.com</p>
    </div>

    <!-- Sidebar Recipe Lists -->
    <nav class="sidebar-lists">
      <h4>My Collections</h4>
      <ul>
        <li class="active" onclick="filterByCollection('all', this)">📖 All Recipes</li>
        <li onclick="filterByCollection('favourites', this)">❤️ Favourites (<span id="countFavourites">0</span>)</li>
        <li onclick="filterByCollection('tried', this)">✅ Tried It (<span id="countTried">0</span>)</li>
        <li onclick="filterByCollection('wantToTry', this)">📌 Want to Try (<span id="countWantToTry">0</span>)</li>
      </ul>
    </nav>

    <button onclick="handleLogout()" class="logout-btn">Log Out</button>
  </aside>

  <main class="main-content">
    <header class="content-header">
      <div>
        <h1 id="pageTitle">Featured Recipes</h1>
        <p>Substitute allergens, read reviews, and organize your lists!</p>
      </div>
      <button class="cart-trigger-btn" onclick="toggleCartModal(true)">
        🛒 Cart (<span id="cartCount">0</span>)
      </button>
    </header>

    <!-- Controls Bar -->
    <section class="controls-bar">
      <input type="text" id="searchInput" placeholder="Search recipes or ingredients..." oninput="filterRecipes()">
      <select id="categoryFilter" onchange="filterRecipes()">
        <option value="All">All Categories</option>
        <option value="Italian">Italian</option>
        <option value="Breakfast">Breakfast</option>
        <option value="Dinner">Dinner</option>
        <option value="Healthy">Healthy</option>
        <option value="Seafood">Seafood</option>
        <option value="Dessert">Dessert</option>
      </select>
    </section>

    <!-- Recipe Grid -->
    <div class="recipe-grid" id="recipeGrid"></div>
  </main>

  <!-- Large Recipe Detail, Media, Steps & Reviews Modal -->
  <div id="recipeModal" class="modal-overlay hidden" onclick="closeModalOnOverlay(event, 'recipeModal')">
    <div class="modal-card modal-large">
      <button class="close-btn" onclick="toggleRecipeModal(false)">&times;</button>
      <div id="modalRecipeContent"></div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="modal-overlay hidden" onclick="closeModalOnOverlay(event, 'cartModal')">
    <div class="modal-card">
      <button class="close-btn" onclick="toggleCartModal(false)">&times;</button>
      <h2>Your Ingredient Cart</h2>
      <div id="cartItemsContainer" class="cart-items"></div>
      <div class="cart-footer">
        <p>Total Cost: <strong id="cartTotalPrice">$0.00</strong></p>
        <button class="checkout-btn" onclick="clearCart()">Clear Cart</button>
      </div>
    </div>
  </div>


  <!-- Firebase CDN Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  

  <script src="dashboard.js"></script>
</body>
</html>
