<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dished - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <h2>Dished</h2>
      <div class="user-profile">
        <div id="userInitials" class="avatar">G</div>
        <div>
          <h4 id="profileName">Guest</h4>
          <p id="profileEmail">guest@example.com</p>
        </div>
      </div>

      <button onclick="toggleAddRecipeModal(true)" class="add-recipe-btn">➕ Add Public Recipe</button>

      <nav>
        <ul class="sidebar-lists">
          <li class="active" onclick="filterByCollection('all', this)">Featured Recipes</li>
          <li onclick="filterByCollection('favourites', this)">❤️ Favourites (<span id="countFavourites">0</span>)</li>
          <li onclick="filterByCollection('tried', this)">✅ Tried (<span id="countTried">0</span>)</li>
          <li onclick="filterByCollection('wantToTry', this)">📌 Want to Try (<span id="countWantToTry">0</span>)</li>
        </ul>
      </nav>

      <button onclick="handleLogout()" class="logout-btn">Log Out</button>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="content-header">
        <div>
          <h1 id="pageTitle">Featured Recipes</h1>
        </div>
        <div class="header-actions">
          <input type="text" id="searchInput" placeholder="Search recipes..." onkeyup="filterRecipes()">
          <select id="categoryFilter" onchange="filterRecipes()">
            <option value="All">All Categories</option>
            <option value="Italian">Italian</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Mexican">Mexican</option>
            <option value="Asian">Asian</option>
            <option value="Dessert">Dessert</option>
          </select>
          <button onclick="toggleCartModal(true)" class="cart-btn">🛒 Cart (<span id="cartCount">0</span>)</button>
        </div>
      </header>

      <!-- Recipe Display Grid -->
      <section id="recipeGrid" class="recipe-grid">
        <p>Loading community recipes...</p>
      </section>
    </main>
  </div>

  <!-- Recipe Detail Modal -->
  <div id="recipeModal" class="modal hidden" onclick="closeModalOnOverlay(event, 'recipeModal')">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleRecipeModal(false)">&times;</button>
      <div id="modalRecipeContent"></div>
    </div>
  </div>

  <!-- Add New Recipe Modal -->
  <div id="addRecipeModal" class="modal hidden" onclick="closeModalOnOverlay(event, 'addRecipeModal')">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleAddRecipeModal(false)">&times;</button>
      <h2>Add a Public Recipe</h2>
      <p style="font-size:0.85rem; color:#666; margin-bottom:1rem;">This recipe will be stored in Firebase and visible to everyone.</p>
      <form id="addRecipeForm" onsubmit="handleAddNewRecipe(event)">
        <input type="text" id="newTitle" placeholder="Recipe Title" required>
        <select id="newTag" required>
          <option value="Italian">Italian</option>
          <option value="Breakfast">Breakfast</option>
          <option value="Mexican">Mexican</option>
          <option value="Asian">Asian</option>
          <option value="Dessert">Dessert</option>
        </select>
        <input type="url" id="newImage" placeholder="Image URL (e.g., https://...)" required>
        <input type="url" id="newVideo" placeholder="YouTube Embed Link (Optional)">
        <textarea id="newDesc" placeholder="Brief Description" required></textarea>
        <div style="display:flex; gap:0.5rem;">
          <input type="text" id="newTime" placeholder="Prep Time (e.g., 20 mins)" required>
          <input type="text" id="newDifficulty" placeholder="Difficulty (Easy/Medium)" required>
          <input type="number" step="0.01" id="newPrice" placeholder="Estimated Price ($)" required>
        </div>
        <textarea id="newIngredients" placeholder="Ingredients (separated by commas, e.g., Pasta, Cheese, Pepper)" required></textarea>
        <textarea id="newSteps" placeholder="Instructions (separated by new lines)" required></textarea>
        <button type="submit" class="submit-btn">Publish to Community</button>
      </form>
    </div>
  </div>

  <!-- Shopping Cart Modal -->
  <div id="cartModal" class="modal hidden" onclick="closeModalOnOverlay(event, 'cartModal')">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleCartModal(false)">&times;</button>
      <h2>Shopping Cart</h2>
      <div id="cartItemsContainer"></div>
      <div class="cart-footer">
        <h3>Total: <span id="cartTotalPrice">$0.00</span></h3>
        <button onclick="clearCart()" class="clear-btn">Clear Cart</button>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
