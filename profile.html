<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dished | Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-cream-100">
    <div class="lg:pl-[300px]">
        <div class="max-w-6xl mx-auto px-5 md:px-8 pb-24">

            <header id="topbar"></header>

            <!-- Profile header -->
            <section class="relative rounded-xl3 overflow-hidden mb-8 animate-fade-up">
                <div class="h-36 sm:h-44 bg-gradient-to-br from-sage-500 via-sage-600 to-sage-800 relative">
                    <div class="absolute -top-10 -right-6 w-56 h-56 rounded-full bg-cream-100/10 blur-2xl"></div>
                </div>

                <div class="bg-white border border-t-0 border-sage-100 px-5 sm:px-8 pt-4 pb-6">
                    <!-- Only the avatar laps over the banner; the name stays on the white -->
                    <div class="flex flex-wrap items-end gap-5">
                        <img id="profile-avatar" src="" alt=""
                            class="relative z-10 -mt-16 w-28 h-28 rounded-full object-cover border-4 border-white shadow-card bg-cream-100">

                        <div class="flex-1 min-w-[200px]">
                            <h1 class="font-display text-3xl sm:text-4xl text-ink leading-tight" id="profile-name">Cook</h1>
                            <p class="text-muted flex items-center gap-1.5 mt-1" id="profile-role">
                                <i class="ph ph-chef-hat"></i> Recipe creator
                            </p>
                        </div>

                        <div class="flex gap-2">
                            <button class="btn btn-primary btn-sm" id="follow-btn"><i class="ph ph-plus"></i> Follow</button>
                            <button class="btn btn-outline btn-sm" id="message-btn"><i class="ph ph-chat-circle-text"></i> Message</button>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-x-10 gap-y-3 mt-6 pt-5 border-t border-sage-100">
                        <div><div class="font-display text-2xl text-ink" id="count-posted">0</div>
                            <div class="text-xs uppercase tracking-wide text-muted">Recipes</div></div>
                        <div><div class="font-display text-2xl text-ink" id="count-liked">0</div>
                            <div class="text-xs uppercase tracking-wide text-muted">Favourites</div></div>
                        <div><div class="font-display text-2xl text-ink" id="count-rating">0.0</div>
                            <div class="text-xs uppercase tracking-wide text-muted">Avg rating</div></div>
                        <div><div class="font-display text-2xl text-ink">248</div>
                            <div class="text-xs uppercase tracking-wide text-muted">Followers</div></div>
                    </div>
                </div>
            </section>

            <!-- Tabs -->
            <div role="tablist" class="inline-flex p-1 mb-6 rounded-full bg-white border border-sage-100">
                <button role="tab" aria-selected="true" data-tab="posted"
                    class="profile-tab px-5 py-2 rounded-full text-sm font-medium transition">Posted recipes</button>
                <button role="tab" aria-selected="false" data-tab="favourites"
                    class="profile-tab px-5 py-2 rounded-full text-sm font-medium transition">Favourites</button>
            </div>

            <section id="panel-posted">
                <div id="posted-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5"></div>
            </section>

            <section id="panel-favourites" class="hidden">
                <div id="favourites-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5"></div>
            </section>

        </div>
    </div>

    <script src="app.js"></script>
    <script>
        (function () {
            var qs = Dished.qs, qsa = Dished.qsa;

            Dished.mountShell({ active: 'home' });
            Dished.mountTopbar('#topbar');

            var me = Dished.auth.current();
            var viewing = sessionStorage.getItem('viewingProfileName') || (me.isGuest ? 'Guest' : me.name);
            var isMe = me.isGuest ? viewing === 'Guest' : viewing === me.name;

            document.title = 'dished | ' + viewing;
            qs('#profile-name').textContent = viewing;

            if (isMe) {
                qs('#profile-avatar').src = Dished.store.get(Dished.K.avatar, null) || Dished.avatar(viewing);
                qs('#profile-avatar').setAttribute('data-avatar', '');
                qs('#follow-btn').outerHTML = '<button class="btn btn-primary btn-sm" id="follow-btn"><i class="ph ph-plus"></i> Add recipe</button>';
                qs('#follow-btn').addEventListener('click', function () { Dished.composer.open(); });
                qs('#message-btn').outerHTML = '<button class="btn btn-outline btn-sm" id="message-btn"><i class="ph ph-gear"></i> Settings</button>';
                qs('#message-btn').addEventListener('click', function () { window.location.href = 'settings.html'; });
            } else {
                qs('#profile-avatar').src = Dished.avatar(viewing);
                qs('#follow-btn').addEventListener('click', function () { Dished.soon('Following cooks'); });
                qs('#message-btn').addEventListener('click', function () { Dished.soon('Messages'); });
            }

            /* ---------------- Which recipes ---------------- */
            var all = Dished.data.all();
            var posted = all.filter(function (r) { return r.creator === viewing; });

            /* A profile's favourites: the viewer's own liked list when it is their
               page, otherwise a stable pick seeded from the name. */
            var favourites;
            if (isMe) {
                var liked = Dished.likes.list();
                favourites = all.filter(function (r) { return liked.indexOf(Number(r.id)) > -1; });
            } else {
                var seed = viewing.length;
                favourites = all.length
                    ? [0, 1, 2].map(function (n) { return all[(seed + n) % all.length]; })
                    : [];
            }

            qs('#count-posted').textContent = posted.length;
            qs('#count-liked').textContent = favourites.length;
            qs('#count-rating').textContent = posted.length
                ? (posted.reduce(function (a, r) { return a + Dished.ratings.summary(r).rating; }, 0) / posted.length).toFixed(1)
                : '0.0';

            qs('#profile-role').innerHTML = posted.length
                ? '<i class="ph ph-chef-hat"></i> Recipe creator'
                : '<i class="ph ph-fork-knife"></i> Hungry browser';

            /* ---------------- Render ---------------- */
            function paint(container, list, empty) {
                container.innerHTML = '';
                if (!list.length) return Dished.emptyState(container, empty[0], empty[1], empty[2]);
                list.forEach(function (recipe, i) {
                    var card = Dished.recipeCard(recipe, {});
                    card.style.animationDelay = Math.min(i * 40, 320) + 'ms';
                    card.classList.add('animate-fade-up');
                    container.appendChild(card);
                });
            }

            function renderAll() {
                all = Dished.data.all();
                posted = all.filter(function (r) { return r.creator === viewing; });
                qs('#count-posted').textContent = posted.length;
                paint(qs('#posted-grid'), posted, ['cooking-pot', 'No recipes yet',
                    isMe ? 'Publish your first recipe and it will show up here.' : viewing + ' has not shared a recipe yet.']);
                paint(qs('#favourites-grid'), favourites, ['heart', 'No favourites yet',
                    'Recipes get saved here when you tap the heart on a card.']);
            }

            Dished.on('recipes:change', renderAll);
            renderAll();

            /* ---------------- Tabs ---------------- */
            function selectTab(key) {
                qsa('.profile-tab').forEach(function (tab) {
                    var on = tab.dataset.tab === key;
                    tab.setAttribute('aria-selected', on ? 'true' : 'false');
                    tab.classList.toggle('bg-sage-500', on);
                    tab.classList.toggle('text-cream-100', on);
                    tab.classList.toggle('text-muted', !on);
                });
                qs('#panel-posted').classList.toggle('hidden', key !== 'posted');
                qs('#panel-favourites').classList.toggle('hidden', key !== 'favourites');
            }
            qsa('.profile-tab').forEach(function (tab) {
                tab.addEventListener('click', function () { selectTab(tab.dataset.tab); });
            });
            selectTab('posted');
        })();
    </script>
</body>

</html>
