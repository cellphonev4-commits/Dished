<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dished - User Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="profile-sidebar">
       
        <h1 style="font-size: 40px; color: #fdfcd7; text-align: center; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); cursor: pointer;" onclick="window.location.href='home.html'">dished</h1>
        
        
        <div class="sidebar-nav">
            <a href="home.html" class="sidebar-nav-link">Home</a>
            <a href="#" class="sidebar-nav-link">Explore</a>
            <a href="#" class="sidebar-nav-link">Lists</a>
            <a href="#" class="sidebar-nav-link">Liked Recipes</a>
        </div>
        
        <div style="margin-top: auto; padding: 20px; color: #fdfcd7; text-align: center;">
            <p>Back to <a href="home.html" style="color: #fdfcd7; text-decoration: underline;">Home</a></p>
        </div>
    </div>

    
    <div class="main-content">
        
        <header class="main-header" style="margin-bottom: 30px;">
            <h1 style="font-size: 32px; color: #5b8266; margin: 0; cursor: pointer; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);" onclick="window.location.href='home.html'">dished</h1>
        </header>

        
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 40px; border-bottom: 2px solid rgba(91, 130, 102, 0.2); padding-bottom: 20px;">
            <img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=150&auto=format&fit=crop" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid #5b8266; object-fit: cover;" alt="Profile Picture">
            <div>
                <h1 style="font-size: 36px; color: #5b8266; margin: 0;" id="profile-display-name">@Username</h1>
                <p style="color: #777; margin-top: 5px; font-size: 16px;">Recipe Creator & Enthusiast</p>
            </div>
        </div>

        <div class="recipes-section">
            <h2 class="section-title">Posted Recipes</h2>
            <div id="posted-recipes-grid" class="recipes-grid">
                
            </div>
        </div>

        <div class="recipes-section" style="margin-top: 50px;">
            <h2 class="section-title">Favorited Recipes</h2>
            <div id="favorited-recipes-grid" class="recipes-grid">
                
            </div>
        </div>
    </div>

    <script>
        const viewingProfileName = sessionStorage.getItem('viewingProfileName');
        if (!viewingProfileName) {
            
            window.location.href = 'home.html';
        }

        document.getElementById('profile-display-name').textContent = "@" + viewingProfileName;

        const defaultFoodImg = 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=500&auto=format&fit=crop';
        
        let recipes = JSON.parse(localStorage.getItem('dishedRecipes')) || [];
        const featured = JSON.parse(localStorage.getItem('featuredRecipes')) || [];
        const allRecipes = recipes.concat(featured);

        const postedGrid = document.getElementById('posted-recipes-grid');
        const favoritedGrid = document.getElementById('favorited-recipes-grid');

        // Filter for posted
        const postedRecipes = allRecipes.filter(r => r.creator === viewingProfileName);

        // Render Posted Recipes
        if (postedRecipes.length === 0) {
            postedGrid.innerHTML = '<p style="color: #555; font-size: 18px;">No recipes posted yet.</p>';
        } else {
            postedRecipes.forEach(recipe => {
                const card = createCard(recipe);
                postedGrid.appendChild(card);
            });
        }

       
        const seed = viewingProfileName.length;
        let selected = [];
        if (allRecipes.length > 0) {
            selected.push(allRecipes[(seed) % allRecipes.length]);
            if(allRecipes.length > 1) selected.push(allRecipes[(seed+1) % allRecipes.length]);
            if(allRecipes.length > 2) selected.push(allRecipes[(seed+2) % allRecipes.length]);
        }

        if (selected.length === 0) {
            favoritedGrid.innerHTML = '<p style="color: #555; font-size: 18px;">No favorited recipes.</p>';
        } else {
            selected.forEach(recipe => {
                const card = createCard(recipe);
                favoritedGrid.appendChild(card);
            });
        }

        function createCard(recipe) {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            
            card.innerHTML = `
                <img src="${recipe.imgUrl || defaultFoodImg}" class="recipe-card-img" alt="${recipe.title}">
                <div class="recipe-card-overlay">
                    <h3 class="recipe-card-title">${recipe.title}</h3>
                </div>
            `;

            card.addEventListener('click', () => {
                sessionStorage.setItem('activeRecipeId', recipe.id);
                window.location.href = 'recipe.html';
            });
            return card;
        }
    </script>
</body>

</html>
