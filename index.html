<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dished - Login / Sign Up</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap');
  </style>

  <!-- Add Firebase SDKs here -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="form-toggle">
      <button id="loginTabBtn" class="active" onclick="switchTab('login')">Log In</button>
      <button id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
      <h2>Welcome Back</h2>
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit" class="submit-btn">Log In</button>
      <p id="loginError" class="error-msg"></p>
    </form>

    <!-- Sign Up Form -->
    <form id="signupForm" class="auth-form" onsubmit="handleSignUp(event)">
      <h2>Create Account</h2>
      <input type="text" id="signupName" placeholder="Full Name" required>
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password" required>
      <button type="submit" class="submit-btn">Sign Up</button>
      <p id="signupError" class="error-msg"></p>
    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
